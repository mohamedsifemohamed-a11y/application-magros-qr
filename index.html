<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قارئ QR – سلع الوكيل</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2e7d32"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f3;--sf:#fff;--tx:#1d2b1f;--mu:#6b7a6d;--pr:#2e7d32;--pt:#fff;--bd:#dde4dc;--dg:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121612;--sf:#1c231d;--tx:#e8efe8;--mu:#93a395;--pr:#66bb6a;--pt:#0d1a0e;--bd:#2d382e;--dg:#ef5350}}
:root[data-theme="dark"]{--bg:#121612;--sf:#1c231d;--tx:#e8efe8;--mu:#93a395;--pr:#66bb6a;--pt:#0d1a0e;--bd:#2d382e;--dg:#ef5350}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,"Segoe UI",Tahoma,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pr);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pr);color:var(--pt);padding:10px 12px;z-index:5}
h1{margin:0 0 8px;font-size:18px}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--sf)}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button,.chip{flex:1;padding:8px;border:0;border-radius:18px;background:rgba(255,255,255,.2);color:var(--pt)}
.tabs .on{background:var(--pt);color:var(--pr);font-weight:700}
main{padding:10px 12px 80px;max-width:720px;margin:auto}
.chips{display:flex;gap:6px;margin-bottom:8px}
.chips button{flex:1;padding:8px;border:1px solid var(--bd);border-radius:18px;background:var(--sf)}
.chips .on{background:var(--pr);color:var(--pt);border-color:var(--pr)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card b{display:block;direction:ltr;text-align:right}.mu{color:var(--mu);font-size:13px}
.badge{background:var(--pr);color:var(--pt);border-radius:10px;padding:2px 8px;font-size:12px;white-space:nowrap}
.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 40px;z-index:20}
[hidden]{display:none!important}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:3px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--pr);color:var(--pt);font-weight:700}
.btn.s{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.del{background:none;border:0;color:var(--dg);font-size:20px}
.pr{font-size:14px;line-height:1.7}.gain{color:var(--pr);font-weight:700}.loss{color:var(--dg);font-weight:700}
table{border-collapse:collapse;width:100%;background:var(--sf)}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:right;white-space:nowrap;font-size:14px}th{background:var(--pr);color:var(--pt)}.up{display:block;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--sf);margin-bottom:8px;font-weight:700}
header{padding:14px 14px 12px;overflow:hidden}header p{margin:0;font-size:13px;opacity:.9}.deco{position:absolute;left:0;top:0;height:100%;opacity:.16;pointer-events:none}header h1,header p{position:relative}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.tl{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 4px;text-align:center;font-size:13px;font-weight:700;color:var(--tx);cursor:pointer}.tl i{display:block;font-size:30px;font-style:normal;margin-bottom:4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.st{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}.st b{display:block;font-size:24px;color:var(--pr)}.st span{font-size:12px;color:var(--mu)}
.av{width:42px;height:42px;border-radius:50%;background:var(--pr);color:var(--pt);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}.card[data-o]{cursor:pointer;justify-content:flex-start}
.tg{padding:2px 8px;border-radius:10px;font-size:12px}.tg.v{background:rgba(46,125,50,.18);color:var(--pr)}.tg.f{background:rgba(239,108,0,.2);color:#ef6c00}.ok{background:rgba(46,125,50,.15);color:var(--pr);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:700}
